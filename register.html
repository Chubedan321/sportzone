<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký - SportZone</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container nav-bar">
        <a href="index.html" class="logo" style="text-decoration: none; color: #fff"
          >Sport<span>Zone</span></a
        >
        <nav class="nav-links">
          <a href="index.html">Trang Chủ</a>
          <a href="products.html">Tất Cả Sản Phẩm</a>
          <a href="products.html?status=new">Hàng Mới</a>
          <a href="products.html?status=hot">Bán Chạy</a>
          <a href="products.html?status=sale">Flash Sale</a>
          <a href="index.html#contact-section">Liên Hệ</a>
        </nav>
        <div class="header-right">
          <div id="user-display"></div>
          <a href="cart.html" class="cart-btn">
            <span class="cart-icon">🛒</span>
            <span>Giỏ Hàng</span>
            <span class="cart-badge" id="cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container" style="padding: 60px 0">
      <div class="auth-page-box">
        <h2 style="text-align: center; margin-bottom: 8px">Đăng Ký Tài Khoản</h2>
        <p class="auth-sub" style="text-align: center">
          Tạo tài khoản để nhận nhiều ưu đãi thành viên
        </p>

        <form id="register-page-form" onsubmit="handleRegisterPageSubmit(event)" novalidate>
          <div class="form-group">
            <label for="page-reg-fullname">Họ và tên *</label>
            <input type="text" id="page-reg-fullname" placeholder="VD: Nguyễn Văn A" />
            <span class="error-msg" id="err-page-reg-name"></span>
          </div>

          <div class="form-group">
            <label for="page-reg-email">Email *</label>
            <input type="email" id="page-reg-email" placeholder="VD: email@example.com" />
            <span class="error-msg" id="err-page-reg-email"></span>
          </div>

          <div class="form-group">
            <label for="page-reg-password">Mật khẩu * (Tối thiểu 6 ký tự)</label>
            <input type="password" id="page-reg-password" placeholder="Nhập mật khẩu..." />
            <span class="error-msg" id="err-page-reg-pass"></span>
          </div>

          <div class="form-group">
            <label for="page-reg-repassword">Xác nhận mật khẩu *</label>
            <input
              type="password"
              id="page-reg-repassword"
              placeholder="Nhập lại đúng mật khẩu..."
            />
            <span class="error-msg" id="err-page-reg-repass"></span>
          </div>

          <button type="submit" class="btn-submit" style="margin-top: 10px">Tạo Tài Khoản</button>

          <p class="switch-link">Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a></p>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer" id="footer-app"></footer>

    <script src="js/app.js"></script>
    <script>
      function handleRegisterPageSubmit(e) {
        e.preventDefault();
        const fullname = document.getElementById("page-reg-fullname").value.trim();
        const email = document.getElementById("page-reg-email").value.trim().toLowerCase();
        const password = document.getElementById("page-reg-password").value.trim();
        const repassword = document.getElementById("page-reg-repassword").value.trim();

        const errName = document.getElementById("err-page-reg-name");
        const errEmail = document.getElementById("err-page-reg-email");
        const errPass = document.getElementById("err-page-reg-pass");
        const errRePass = document.getElementById("err-page-reg-repass");

        errName.textContent = "";
        errEmail.textContent = "";
        errPass.textContent = "";
        errRePass.textContent = "";

        let isValid = true;
        if (fullname === "") {
          errName.textContent = "Vui lòng nhập họ và tên.";
          isValid = false;
        }
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (email === "" || !emailRegex.test(email)) {
          errEmail.textContent = "Email không đúng định dạng.";
          isValid = false;
        }
        if (password === "" || password.length < 6) {
          errPass.textContent = "Mật khẩu phải từ 6 ký tự trở lên.";
          isValid = false;
        }
        if (repassword === "") {
          errRePass.textContent = "Vui lòng nhập lại mật khẩu xác nhận.";
          isValid = false;
        } else if (password !== repassword) {
          errRePass.textContent = "Mật khẩu xác nhận không trùng khớp!";
          isValid = false;
        }

        if (!isValid) return;

        const users = getUsersList();
        for (let i = 0; i < users.length; i++) {
          if (users[i].email === email) {
            errEmail.textContent = "Email này đã được đăng ký trước đó!";
            return;
          }
        }

        users.push({ fullname: fullname, email: email, password: password });
        saveUsersList(users);

        alert("🎉 Đăng ký thành công! Bạn sẽ được chuyển sang trang Đăng nhập.");
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
