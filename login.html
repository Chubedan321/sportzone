<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập - SportZone</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container nav-bar">
        <a href="index.html" class="logo" style="text-decoration: none; color: #fff"
          >Sport<span>Zone</span></a
        >
        <nav class="nav-links">
          <a href="index.html">Trang Chủ</a>
          <a href="products.html">Tất Cả Sản Phẩm</a>
          <a href="products.html?status=new">Hàng Mới</a>
          <a href="products.html?status=hot">Bán Chạy</a>
          <a href="products.html?status=sale">Flash Sale</a>
          <a href="index.html#contact-section">Liên Hệ</a>
        </nav>
        <div class="header-right">
          <div id="user-display"></div>
          <a href="cart.html" class="cart-btn">
            <span class="cart-icon">🛒</span>
            <span>Giỏ Hàng</span>
            <span class="cart-badge" id="cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container" style="padding: 60px 0">
      <div class="auth-page-box">
        <h2 style="text-align: center; margin-bottom: 8px">Đăng Nhập Tài Khoản</h2>
        <p class="auth-sub" style="text-align: center">Vui lòng đăng nhập để tiếp tục mua sắm</p>

        <form id="login-page-form" onsubmit="handleLoginPageSubmit(event)" novalidate>
          <div class="form-group">
            <label for="page-login-username">Email đăng nhập *</label>
            <input type="text" id="page-login-username" placeholder="Nhập địa chỉ email..." />
            <span class="error-msg" id="err-page-login-user"></span>
          </div>

          <div class="form-group">
            <label for="page-login-password">Mật khẩu *</label>
            <input type="password" id="page-login-password" placeholder="Nhập mật khẩu..." />
            <span class="error-msg" id="err-page-login-pass"></span>
          </div>

          <button type="submit" class="btn-submit" style="margin-top: 10px">Đăng Nhập Ngay</button>

          <p class="switch-link">
            Chưa có tài khoản? <a href="register.html">Đăng ký tài khoản mới</a>
          </p>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer" id="footer-app"></footer>

    <script src="js/app.js"></script>
    <script>
      function handleLoginPageSubmit(e) {
        e.preventDefault();
        const accountInput = document
          .getElementById("page-login-username")
          .value.trim()
          .toLowerCase();
        const password = document.getElementById("page-login-password").value.trim();
        const errUser = document.getElementById("err-page-login-user");
        const errPass = document.getElementById("err-page-login-pass");

        errUser.textContent = "";
        errPass.textContent = "";

        let isValid = true;
        if (accountInput === "") {
          errUser.textContent = "Vui lòng nhập email đăng nhập.";
          isValid = false;
        }
        if (password === "") {
          errPass.textContent = "Vui lòng nhập mật khẩu.";
          isValid = false;
        }

        if (!isValid) return;

        const users = getUsersList();
        let matchedUser = null;
        for (let i = 0; i < users.length; i++) {
          if (users[i].email === accountInput && users[i].password === password) {
            matchedUser = users[i];
            break;
          }
        }

        if (!matchedUser) {
          errPass.textContent = "Email hoặc mật khẩu không chính xác.";
          return;
        }

        localStorage.setItem("CURRENT_USER", matchedUser.fullname || matchedUser.email);
        alert(`Chào mừng ${matchedUser.fullname || matchedUser.email} quay trở lại!`);

        const pendingId = localStorage.getItem("PENDING_PRODUCT_ID");
        if (pendingId) {
          localStorage.removeItem("PENDING_PRODUCT_ID");
          executeAddToCart(parseInt(pendingId));
        }

        // Kiểm tra đích chuyển hướng (Nếu từ Mua Ngay chuyển sang thì tới thẳng checkout.html)
        const redirectTarget = localStorage.getItem("REDIRECT_TARGET");
        if (redirectTarget) {
          localStorage.removeItem("REDIRECT_TARGET");
          window.location.href = redirectTarget;
          return;
        }

        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
