<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh Toán - SportZone</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="container nav-bar">
        <a href="index.html" class="logo" style="text-decoration: none; color: #fff"
          >Sport<span>Zone</span></a
        >
        <nav class="nav-links">
          <a href="index.html">Trang Chủ</a>
          <a href="products.html">Tất Cả Sản Phẩm</a>
          <a href="products.html?status=new">Hàng Mới</a>
          <a href="products.html?status=hot">Bán Chạy</a>
          <a href="products.html?status=sale">Flash Sale</a>
          <a href="index.html#contact-section">Liên Hệ</a>
        </nav>
        <div class="header-right">
          <div id="user-display"></div>
          <a href="cart.html" class="cart-btn">
            <span class="cart-icon">🛒</span>
            <span>Giỏ Hàng</span>
            <span class="cart-badge" id="cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container" style="padding: 40px 0 60px">
      <div class="breadcrumb">
        <a href="index.html">Trang Chủ</a> / <a href="cart.html">Giỏ Hàng</a> /
        <strong>Thanh Toán</strong>
      </div>

      <h1 class="section-title" style="margin-bottom: 25px">Xác Nhận Đơn Hàng & Thanh Toán</h1>

      <div class="checkout-layout">
        <div class="checkout-form-box">
          <h3 style="margin-bottom: 18px">Thông Tin Nhận Hàng</h3>
          <form id="checkout-form" onsubmit="handleCheckoutSubmit(event)" novalidate>
            <div class="form-group">
              <label for="order-name">Họ và tên người nhận *</label>
              <input type="text" id="order-name" placeholder="VD: Nguyễn Văn A" />
              <span class="error-msg" id="err-order-name"></span>
            </div>
            <div class="form-group">
              <label for="order-phone">Số điện thoại liên hệ *</label>
              <input type="tel" id="order-phone" placeholder="VD: 0912345678" />
              <span class="error-msg" id="err-order-phone"></span>
            </div>
            <div class="form-group">
              <label for="order-email">Email nhận hóa đơn *</label>
              <input type="email" id="order-email" placeholder="VD: email@example.com" />
              <span class="error-msg" id="err-order-email"></span>
            </div>
            <div class="form-group">
              <label for="order-address">Địa chỉ giao hàng chi tiết *</label>
              <textarea
                id="order-address"
                rows="3"
                placeholder="Số nhà, tên đường, phường/xã, quận/huyện..."
              ></textarea>
              <span class="error-msg" id="err-order-address"></span>
            </div>
            <div class="form-group">
              <label>Phương thức thanh toán:</label>
              <div style="display: flex; gap: 20px; margin-top: 8px">
                <label style="font-weight: normal; cursor: pointer"
                  ><input type="radio" name="paymethod" checked /> Thanh toán khi nhận hàng
                  (COD)</label
                >
                <label style="font-weight: normal; cursor: pointer"
                  ><input type="radio" name="paymethod" /> Chuyển khoản ngân hàng</label
                >
              </div>
            </div>
            <button type="submit" class="btn-submit" style="margin-top: 15px">
              Xác Nhận Đặt Hàng Ngay
            </button>
          </form>
        </div>

        <div class="checkout-order-summary">
          <h3 style="margin-bottom: 18px">Đơn Hàng Của Bạn</h3>
          <div id="checkout-items-list"></div>
          <div class="summary-line total" style="margin-top: 15px; padding-top: 15px">
            <strong>Tổng thanh toán:</strong>
            <strong id="checkout-total-price" style="color: #e63946; font-size: 18px">0đ</strong>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer" id="footer-app"></footer>

    <script src="js/app.js"></script>
    <script>
      function renderCheckoutSummary() {
        const listEl = document.getElementById("checkout-items-list");
        const totalEl = document.getElementById("checkout-total-price");
        if (!listEl) return;

        if (cart.length === 0) {
          listEl.innerHTML = `<p style="color:#666;">Không có sản phẩm nào trong giỏ hàng để thanh toán.</p>`;
          if (totalEl) totalEl.textContent = "0đ";
          return;
        }

        let total = 0;
        let html = "";
        for (let i = 0; i < cart.length; i++) {
          const item = cart[i];
          const subtotal = item.price * item.quantity;
          total += subtotal;
          html += `
            <div class="checkout-item-row">
              <img src="${item.image}" alt="${item.name}" />
              <div style="flex-grow:1;">
                <div style="font-weight:600; font-size:14px;">${item.name}</div>
                <div style="font-size:12px; color:#666;">Số lượng: ${item.quantity} x ${item.price.toLocaleString("vi-VN")}đ</div>
              </div>
              <strong style="color:#e63946; font-size:14px;">${subtotal.toLocaleString("vi-VN")}đ</strong>
            </div>
          `;
        }
        listEl.innerHTML = html;
        if (totalEl) totalEl.textContent = total.toLocaleString("vi-VN") + "đ";
      }

      function handleCheckoutSubmit(e) {
        e.preventDefault();
        if (cart.length === 0) {
          alert("Giỏ hàng rỗng, không thể đặt hàng!");
          return;
        }

        const name = document.getElementById("order-name").value.trim();
        const phone = document.getElementById("order-phone").value.trim();
        const email = document.getElementById("order-email").value.trim();
        const address = document.getElementById("order-address").value.trim();

        const errName = document.getElementById("err-order-name");
        const errPhone = document.getElementById("err-order-phone");
        const errEmail = document.getElementById("err-order-email");
        const errAddress = document.getElementById("err-order-address");

        errName.textContent = "";
        errPhone.textContent = "";
        errEmail.textContent = "";
        errAddress.textContent = "";

        let isValid = true;
        if (name === "") {
          errName.textContent = "Vui lòng nhập tên người nhận.";
          isValid = false;
        }
        const phoneRegex = /^0[0-9]{9}$/;
        if (phone === "" || !phoneRegex.test(phone)) {
          errPhone.textContent = "SĐT phải gồm 10 chữ số bắt đầu bằng số 0.";
          isValid = false;
        }
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (email === "" || !emailRegex.test(email)) {
          errEmail.textContent = "Email không đúng định dạng.";
          isValid = false;
        }
        if (address === "") {
          errAddress.textContent = "Vui lòng nhập địa chỉ nhận hàng.";
          isValid = false;
        }

        if (!isValid) return;

        alert(
          "🎉 Chúc mừng bạn đã đặt hàng thành công! Đơn hàng sẽ được giao trong 2 - 4 ngày tới.",
        );
        cart = [];
        saveCartToStorage();
        window.location.href = "index.html";
      }

      renderCheckoutSummary();
    </script>
  </body>
</html>
